<header class="topbar">
  <div class="brand">
    <div class="brand__icon">
      <span></span>
    </div>
    <div class="brand__text">
      <strong>SPRINTEL</strong>
      <span>Telas Metálicas</span>
    </div>
  </div>

  <!-- Nav desktop -->
  <nav class="nav">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/quienes-somos" routerLinkActive="active">Quiénes Somos</a>
    <a routerLink="/productos" routerLinkActive="active">Productos</a>
    <a routerLink="/contacto" routerLinkActive="active">Contacto</a>
  </nav>

  <div class="contacts">
    <div class="contact">
      <span class="contact__icon">📞</span>
      <span>+54 9 11 7000-7600</span>
    </div>
    <div class="contact">
      <span class="contact__icon">✉️</span>
      <span>informes@sprintel.com.ar</span>
    </div>
  </div>

  <!-- Botón hamburguesa (solo mobile) -->
  <button
    class="burger"
    type="button"
    [class.is-open]="isOpen()"
    (click)="toggleMenu()"
    aria-label="Abrir menú"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<!-- Overlay menú móvil -->
<div class="mobile-backdrop" [class.is-visible]="isOpen()" (click)="closeMenu()"></div>

<nav class="mobile-nav" [class.is-open]="isOpen()">
  <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Inicio</a>
  <a routerLink="/quienes-somos" routerLinkActive="active" (click)="closeMenu()">Quiénes Somos</a>
  <a routerLink="/productos" routerLinkActive="active" (click)="closeMenu()">Productos</a>
  <a routerLink="/contacto" routerLinkActive="active" (click)="closeMenu()">Contacto</a>

  <div class="mobile-nav__contacts">
    <div class="contact">
      <span class="contact__icon">📞</span>
      <span>+54 9 11 7000-7600</span>
    </div>
    <div class="contact">
      <span class="contact__icon">✉️</span>
      <span>informes@sprintel.com.ar</span>
    </div>
  </div>
</nav>
